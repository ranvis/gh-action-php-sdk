  name: 'Setup PHP SDK tool kit for Windows PHP builds'
  description: 'Setup Windows build environment for PHP extensions builds with Microsoft Visual C++ command line'
  author: AlexNDRmac
  branding:
    icon: arrow-down-circle
    color: green

  inputs:
    php_version:
      description: 'PHP version to build for (e.g. 8.6)'
      required: true

    ts:
      description: 'Thread Safety'
      required: false
      default: 'nts'

    arch:
      description: 'Target architecture (x64, x86)'
      required: false
      default: 'x64'

    vc:
      description: 'VC toolset name (e.g. vs17)'
      required: false
      default: ''

    install_dir:
      description: 'Target directory for php-sdk tools installation (e.g: C:\tools)'
      required: true

    cache_dir:
      description: 'Cache directory for downloads. Default: system tmp dir'
      required: false
      default: ''

  outputs:
    vc:
      value: ${{ steps.final.outputs.vc }}

  runs:
    using: composite
    steps:
      - name: Resolve VC
        id: default_vc
        if: inputs.vc == ''
        uses: ./vc-ver
        with:
          php_version: ${{ inputs.php_version }}

      - id: final
        shell: powershell
        run: |
          if ("${{ inputs.vc }}" -ne "") {
              $VC = "${{ inputs.vc }}"
          } else {
              $VC = "${{ steps.default_vc.outputs.vc }}"
          }

          "vc=$VC" >> $env:GITHUB_OUTPUT

      - name: Set Up PHP SDK with Developer Pack
        shell: powershell
        run: |
          ${{github.action_path}}\src\setup-php-sdk.ps1 `
            -PhpVersion ${{ inputs.php_version }} `
            -ThreadSafety ${{ inputs.ts }} `
            -Arch ${{ inputs.arch }} `
            -VC ${{ steps.final.outputs.vc }} `
            -InstallDir ${{ inputs.install_dir }} `
            -CacheDir ${{ inputs.cache_dir }}
